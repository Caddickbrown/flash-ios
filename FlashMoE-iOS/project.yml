name: FlashMoE
options:
  bundleIdPrefix: com.flashmoe
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
    INFOPLIST_KEY_UIFileSharingEnabled: YES
    # Xcode "recommended settings". DEVELOPMENT_TEAM lives here rather than on
    # the target so the target inherits it — that is what Xcode's "Inherit
    # Development Team from Project Settings" fix-it does.
    DEVELOPMENT_TEAM: 52W73J6V95
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    # "Enable Generated Asset Symbol Extensions" — generates symbols on Apple
    # framework colour/image types (Color, UIColor, Image) for Assets.xcassets.
    # Drives actool's --generate-swift-asset-symbol-extensions.
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

targets:
  FlashMoE:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Views
      - path: Models
      - path: Services
      - path: Bridge
      - path: FlashMoEEngine
      # Asset catalog is the only thing from Resources/ that belongs in a build
      # phase. The entitlements file is referenced via CODE_SIGN_ENTITLEMENTS and
      # must NOT be bundled as a resource.
      - path: Resources/Assets.xcassets
      # Bundled typefaces (SIL OFL). Registered at runtime by FMFonts.register()
      # rather than via UIAppFonts, which has no INFOPLIST_KEY_ equivalent.
      - path: Resources/Fonts
        buildPhase: resources
      - path: Resources/FlashMoE.entitlements
        buildPhase: none
      # shaders.metal is COMPILED (Sources phase) into default.metallib.
      # The engine loads it via newDefaultLibrary. This is why the build
      # requires the Metal toolchain.
      - path: ../metal_infer/shaders.metal
        buildPhase: sources
      # nax_gemm.metal must ship as RAW SOURCE: the engine looks it up with
      # pathForResource:@"nax_gemm" ofType:@"metal" and compiles it at runtime
      # with Metal 4.0 (the NAX tensor path, gated on GPU family 5002).
      #
      # It must NOT go in the resources phase. Xcode matches the .metal
      # extension there and compiles it into default.metallib as well as
      # shaders.metal, producing two MetalLink tasks writing the same output
      # and failing the build with "Unexpected duplicate tasks".
      #
      # A copyFiles phase copies the file verbatim without applying any build
      # rule, so it lands in the bundle root as plain text.
      - path: ../metal_infer/nax_gemm.metal
        buildPhase:
          copyFiles:
            destination: resources
            subpath: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caddickbrown.flashmoe
        PRODUCT_NAME: FlashMoE
        SWIFT_OBJC_BRIDGING_HEADER: Bridge/FlashMoE-Bridging-Header.h

        # Signing (DEVELOPMENT_TEAM is inherited from project-level settings)
        CODE_SIGN_ENTITLEMENTS: Resources/FlashMoE.entitlements
        CODE_SIGN_IDENTITY: "iPhone Developer"
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "Apple Development"

        # Obj-C / C compilation flags for the infer.m unity build.
        # CHAT_MODE also excludes the 0.0.0.0 HTTP server from the binary.
        OTHER_CFLAGS:
          - "-DCHAT_MODE=1"
          - "-DACCELERATE_NEW_LAPACK"
        OTHER_LDFLAGS: "-lcompression"
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/FlashMoEEngine
          - $(SRCROOT)/../metal_infer
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
        CLANG_ENABLE_OBJC_ARC: YES
        GCC_OPTIMIZATION_LEVEL: "2"
        GCC_WARN_INHIBIT_ALL_WARNINGS: NO

        # Platform / deployment
        SDKROOT: iphoneos
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator macosx"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

        # Info.plist keys (generated, no Info.plist file on disk)
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "Flash-MoE"
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      configs:
        Debug:
          ENABLE_APP_SANDBOX: YES
          ENABLE_HARDENED_RUNTIME: YES
          ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
    dependencies:
      - sdk: Metal.framework
      - sdk: Foundation.framework
      - sdk: Accelerate.framework

# Without this block XcodeGen emits no shared scheme and the checked-in
# FlashMoE.xcscheme is lost on regeneration.
# Run/Profile deliberately use Release: a Debug build of the inference engine
# is far too slow to be usable on device.
schemes:
  FlashMoE:
    build:
      targets:
        FlashMoE: all
      parallelizeBuild: true
      buildImplicitDependencies: true
    run:
      config: Release
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
